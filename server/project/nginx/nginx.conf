events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  resolver 127.0.0.11 valid=30s;

  server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # ===== FASTAPI =====
    location /telegram {
      set $fastapi http://backend-fastapi:8000;
      proxy_pass $fastapi;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /users {
      set $fastapi http://backend-fastapi:8000;
      proxy_pass $fastapi;
      proxy_set_header Host $host;
    }

    location /openapi.json {
      set $fastapi http://backend-fastapi:8000;
      proxy_pass $fastapi;
      proxy_set_header Host $host;
    }

    # ===== SUHU (NODE) =====
    location /suhu/rawlog {
      set $node http://backend-node:3000;
      proxy_pass $node;
      proxy_set_header Host $host;
    }

    location /suhu/settings {
      set $node http://backend-node:3000;
      proxy_pass $node;
      proxy_set_header Host $host;
    }

    location /suhu/rawlog/hourly {
      set $node http://backend-node:3000;
      proxy_pass $node;
      proxy_set_header Host $host;
    }

    # ===== FEEDER (NODE) =====
    location /feeder/rawlog {
      set $node http://backend-node:3000;
      proxy_pass $node;
      proxy_set_header Host $host;
    }

    location /feeder/status {
      set $node http://backend-node:3000;
      proxy_pass $node;
      proxy_set_header Host $host;
    }

    location /feeder/settings {
      set $node http://backend-node:3000;
      proxy_pass $node;
      proxy_set_header Host $host;
    }

    # ===== ADMIN (NODE) =====
    location /admin/db {
      set $node http://backend-node:3000;
      proxy_pass $node;
      proxy_set_header Host $host;
    }

    # ===== API (NODE) =====
    location /api {
      set $node http://backend-node:3000;
      proxy_pass $node;
      proxy_set_header Host $host;
    }

    # ===== STATIC PAGES =====
    location = /login            { root /usr/share/nginx/html; try_files /login.html =404; }
    location = /register         { root /usr/share/nginx/html; try_files /register.html =404; }
    location = /admin            { root /usr/share/nginx/html; try_files /crud.html =404; }
    location = /users            { root /usr/share/nginx/html; try_files /crud.html =404; }
    location = /dashboard        { root /usr/share/nginx/html; try_files /dashboard.html =404; }
    location = /forgot-password  { root /usr/share/nginx/html; try_files /forgot-password.html =404; }
    location = /reset-password   { root /usr/share/nginx/html; try_files /reset-password.html =404; }
    location = /suhu             { root /usr/share/nginx/html; try_files /suhu.html =404; }
    location = /guest            { root /usr/share/nginx/html; try_files /guest.html =404; }
    location = /nosend           { root /usr/share/nginx/html; try_files /nosend.html =404; }
    location = /feeder           { root /usr/share/nginx/html; try_files /feeder.html =404; }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}